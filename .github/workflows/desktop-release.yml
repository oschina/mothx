name: Build Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的版本 Tag；留空则使用 GitHub 页面当前选择的 ref'
        required: false
        type: string
        default: ''
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            ui/package-lock.json

      - name: Install Web UI dependencies
        working-directory: ui
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Ensure Electron runtime
        working-directory: desktop
        env:
          ELECTRON_INSTALL_ATTEMPTS: 8
        run: npm run ensure:electron

      - name: Set desktop version from Tag
        working-directory: desktop
        env:
          MOTHX_VERSION: ${{ inputs.tag }}
        run: npm run version:set

      - name: Check desktop version
        working-directory: desktop
        env:
          MOTHX_VERSION: ${{ inputs.tag }}
        run: npm run version:check

      - name: Prepare macOS signing env
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          export_if_nonempty() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
            fi
          }

          if [ -n "${CSC_LINK:-}" ]; then
            if [ ${#CSC_LINK} -gt 2048 ] || [[ "$CSC_LINK" == data:*base64,* ]] || [[ "$CSC_LINK" == *'='* ]]; then
              export_if_nonempty CSC_LINK "$CSC_LINK"
              export_if_nonempty CSC_KEY_PASSWORD "${CSC_KEY_PASSWORD:-}"
              export_if_nonempty APPLE_ID "${APPLE_ID:-}"
              export_if_nonempty APPLE_APP_SPECIFIC_PASSWORD "${APPLE_APP_SPECIFIC_PASSWORD:-}"
              export_if_nonempty APPLE_TEAM_ID "${APPLE_TEAM_ID:-}"
            else
              candidate=""
              if [ -f "$CSC_LINK" ]; then
                candidate="$CSC_LINK"
              elif [ -f "$GITHUB_WORKSPACE/$CSC_LINK" ]; then
                candidate="$GITHUB_WORKSPACE/$CSC_LINK"
              elif [ -f "$GITHUB_WORKSPACE/desktop/$CSC_LINK" ]; then
                candidate="$GITHUB_WORKSPACE/desktop/$CSC_LINK"
              fi

              if [ -n "$candidate" ]; then
                export_if_nonempty CSC_LINK "$candidate"
                export_if_nonempty CSC_KEY_PASSWORD "${CSC_KEY_PASSWORD:-}"
                export_if_nonempty APPLE_ID "${APPLE_ID:-}"
                export_if_nonempty APPLE_APP_SPECIFIC_PASSWORD "${APPLE_APP_SPECIFIC_PASSWORD:-}"
                export_if_nonempty APPLE_TEAM_ID "${APPLE_TEAM_ID:-}"
              else
                echo "::warning::CSC_LINK is set but is not a file or base64 payload; disabling macOS code signing for this run."
                printf 'CSC_LINK=\nCSC_KEY_PASSWORD=\nAPPLE_ID=\nAPPLE_APP_SPECIFIC_PASSWORD=\nAPPLE_TEAM_ID=\n' >> "$GITHUB_ENV"
              fi
            fi
          fi

          printf 'CSC_IDENTITY_AUTO_DISCOVERY=false\n' >> "$GITHUB_ENV"

      - name: Build desktop runtime and Web UI
        # build:runtime vendors one source-built `mothx` CLI per architecture
        # packaged by electron-builder.yml (macOS arm64 + x64, Windows/Linux
        # x64); scripts/after-pack.cjs injects the matching one into the app.
        working-directory: desktop
        env:
          MOTHX_VERSION: ${{ inputs.tag }}
        run: npm run build:runtime

      - name: Build desktop shell
        working-directory: desktop
        run: npm run build

      - name: Build desktop package
        working-directory: desktop
        env:
          MOTHX_VERSION: ${{ inputs.tag }}
        run: npx electron-builder --config electron-builder.yml --${{ matrix.platform }} --publish never

      - name: Generate checksums
        shell: bash
        working-directory: desktop
        run: |
          cd release
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum MothX-Desktop-* > checksums.txt
          else
            shasum -a 256 MothX-Desktop-* > checksums.txt
          fi

      - name: Upload desktop release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: docs/changelog_online_en.md
          generate_release_notes: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, 'pre') }}
          make_latest: ${{ !contains(inputs.tag || github.ref_name, 'pre') }}
          files: |
            desktop/release/MothX-Desktop-*
            desktop/release/checksums.txt
