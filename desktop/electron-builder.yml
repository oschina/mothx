appId: net.mothx.desktop
productName: MothX
copyright: Copyright © 2026 MothX

# The desktop app is a pure ACP client: it spawns the bundled `mothx acp`
# runtime over stdio and renders the standalone desktop/renderer frontend.
# Keep the runtime unpacked so the bundled executable can be spawned directly.
asar: false
compression: maximum

directories:
  output: release
  buildResources: resources

icon: resources/mothx.png

files:
  - dist/**/*
  - package.json
  # The MothX CLI is not copied through `files`: scripts/after-pack.cjs injects
  # exactly one architecture-matching binary into <resources>/app/vendor/mothx/
  # bin/ after packing, so every artifact bundles a runnable runtime and no
  # second copy of the ~60MB binary ships next to the app directory.
  - '!vendor/**'

afterPack: scripts/after-pack.cjs

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  artifactName: MothX-Desktop-macos-${arch}.${ext}

win:
  target:
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: MothX-Desktop-windows-${arch}.${ext}
  verifyUpdateCodeSignature: false

linux:
  category: Development
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  artifactName: MothX-Desktop-linux-amd64.${ext}

publish:
  provider: github
  owner: oschina
  repo: mothx
