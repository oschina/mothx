appId: net.mothx.desktop
productName: MothX
copyright: Copyright © 2026 MothX

# The desktop app is a pure ACP client: it spawns the vendored `mothx acp`
# runtime over stdio and renders the standalone desktop/renderer frontend.
# Keep the runtime unpacked so the vendored executable can be spawned directly.
asar: false
compression: maximum

directories:
  output: release
  buildResources: resources

icon: resources/mothx.png

files:
  - dist/**/*
  - package.json
  - vendor/mothx/bin/mothx*
  - '!vendor/mothx/node_modules/**/*'

afterPack: scripts/after-pack.cjs

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  artifactName: MothX-Desktop-macos-${arch}.${ext}

win:
  target:
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: MothX-Desktop-windows-${arch}.${ext}
  verifyUpdateCodeSignature: false

linux:
  category: Development
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  artifactName: MothX-Desktop-linux-amd64.${ext}

publish:
  provider: github
  owner: oschina
  repo: mothx
